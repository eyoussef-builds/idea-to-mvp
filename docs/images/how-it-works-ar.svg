<svg xmlns="http://www.w3.org/2000/svg" width="700" height="125" viewBox="0 0 1400 250" role="img"><title>كيف تعمل المهارة</title><g font-family="Arial, Noto Sans Arabic, sans-serif"><rect width="1400" height="250" rx="24" fill="#FAF8F2"/><rect x="1072" y="24" width="304" height="202" rx="20" fill="#FFF2AD"/><circle cx="1224" cy="73" r="25" fill="white"/><text x="1224" y="82" fill="#15130F" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="1224" y="138" fill="#15130F" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">احكِ الفكرة</text><text x="1224" y="179" fill="#5E5A50" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ابدأ حتى لو ملاحظاتك غير مرتبة</text><path d="M1059 113l-14 12 14 12" fill="none" stroke="#15130F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="24" width="304" height="202" rx="20" fill="#F4F1E8"/><circle cx="880" cy="73" r="25" fill="white"/><text x="880" y="82" fill="#15130F" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="880" y="138" fill="#15130F" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">أجب عن الأسئلة</text><text x="880" y="179" fill="#5E5A50" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مع كل سؤال توصية وسبب</text><path d="M715 113l-14 12 14 12" fill="none" stroke="#15130F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="384" y="24" width="304" height="202" rx="20" fill="#FFF8D5"/><circle cx="536" cy="73" r="25" fill="white"/><text x="536" y="82" fill="#15130F" font-size="25" font-weight="700" text-anchor="middle">3</text><text x="536" y="138" fill="#15130F" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">راجع الخطة</text><text x="536" y="179" fill="#5E5A50" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">شاهد ما الذي سيتم بناؤه</text><path d="M371 113l-14 12 14 12" fill="none" stroke="#15130F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="24" width="304" height="202" rx="20" fill="#FFE04A"/><circle cx="192" cy="73" r="25" fill="white"/><text x="192" y="82" fill="#15130F" font-size="25" font-weight="700" text-anchor="middle">4</text><text x="192" y="138" fill="#15130F" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">وافق وابدأ البناء</text><text x="192" y="179" fill="#5E5A50" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تنفيذ، اختبار، ثم تسليم</text></g></svg>
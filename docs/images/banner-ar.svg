<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210" viewBox="0 0 1400 420" role="img"><title>من الفكرة إلى منتج</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#F5F0DB"/></linearGradient><linearGradient id="accent"><stop stop-color="#FFE04A"/><stop offset="1" stop-color="#E3BD18"/></linearGradient></defs><g font-family="Arial, Noto Sans Arabic, sans-serif"><rect width="1400" height="420" rx="28" fill="url(#bg)"/><circle cx="1320" cy="20" r="240" fill="#FFE04A" opacity=".045"/><circle cx="100" cy="460" r="240" fill="#E3BD18" opacity=".04"/><text x="1328" y="72" fill="#61522A" font-size="17" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">مهارة لمساعد البرمجة</text><text x="1328" y="153" fill="#15130F" font-size="58" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">من الفكرة إلى منتج</text><text x="1328" y="216" fill="#15130F" font-size="32" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">احكِ الفكرة. وضّحها. ابنِها.</text><text x="1328" y="264" fill="#5E5A50" font-size="22" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext">بحث، أسئلة، خطة، ثم بناء</text><rect x="50" y="82" width="286" height="266" rx="24" fill="white" stroke="#E6DFCA" stroke-width="2"/><rect x="74" y="108" width="238" height="54" rx="13" fill="#FFF2AD"/><circle cx="100" cy="135" r="14" fill="white"/><text x="100" y="141" fill="#15130F" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="205" y="143" fill="#15130F" font-size="22" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">فكرة</text><rect x="74" y="178" width="238" height="54" rx="13" fill="#F4F1E8"/><circle cx="100" cy="205" r="14" fill="white"/><text x="100" y="211" fill="#15130F" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="205" y="213" fill="#15130F" font-size="22" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">خطة</text><rect x="74" y="248" width="238" height="54" rx="13" fill="#FFE04A"/><circle cx="100" cy="275" r="14" fill="white"/><text x="100" y="281" fill="#15130F" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="205" y="283" fill="#15130F" font-size="22" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">منتج</text><rect x="1050" y="319" width="184" height="38" rx="19" fill="white" stroke="#DED5B8"/><text x="1142.0" y="344" fill="#15130F" font-size="16" font-weight="700" text-anchor="middle">English + العربية</text><rect x="1246" y="319" width="70" height="38" rx="19" fill="white" stroke="#DED5B8"/><text x="1281.0" y="344" fill="#15130F" font-size="16" font-weight="700" text-anchor="middle">MIT</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210" viewBox="0 0 1400 420" role="img"><title>من الفكرة إلى منتج</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><g font-family="Arial, Noto Sans Arabic, sans-serif"><rect width="1400" height="420" rx="28" fill="url(#bg)"/><circle cx="1320" cy="20" r="240" fill="#8b5cf6" opacity=".045"/><circle cx="100" cy="460" r="240" fill="#6366f1" opacity=".04"/><text x="1328" y="72" fill="#6d5ab0" font-size="17" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">مهارة لمساعد البرمجة</text><text x="1328" y="153" fill="#17213d" font-size="58" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">من الفكرة إلى منتج</text><text x="1328" y="216" fill="#51468a" font-size="32" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">احكِ الفكرة. وضّحها. ابنِها.</text><text x="1328" y="264" fill="#55617b" font-size="22" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext">بحث، أسئلة، خطة، ثم بناء</text><rect x="50" y="82" width="286" height="266" rx="24" fill="white" stroke="#e4e2f6" stroke-width="2"/><rect x="74" y="108" width="238" height="54" rx="13" fill="#efe8ff"/><circle cx="100" cy="135" r="14" fill="white"/><text x="100" y="141" fill="#5c4c96" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="205" y="143" fill="#273454" font-size="22" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">فكرة</text><rect x="74" y="178" width="238" height="54" rx="13" fill="#e4efff"/><circle cx="100" cy="205" r="14" fill="white"/><text x="100" y="211" fill="#5c4c96" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="205" y="213" fill="#273454" font-size="22" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">خطة</text><rect x="74" y="248" width="238" height="54" rx="13" fill="#dff5ed"/><circle cx="100" cy="275" r="14" fill="white"/><text x="100" y="281" fill="#5c4c96" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="205" y="283" fill="#273454" font-size="22" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">منتج</text><rect x="1050" y="319" width="184" height="38" rx="19" fill="white" stroke="#ddd8f3"/><text x="1142.0" y="344" fill="#6653a6" font-size="16" font-weight="700" text-anchor="middle">English + العربية</text><rect x="1246" y="319" width="70" height="38" rx="19" fill="white" stroke="#ddd8f3"/><text x="1281.0" y="344" fill="#6653a6" font-size="16" font-weight="700" text-anchor="middle">MIT</text></g></svg>
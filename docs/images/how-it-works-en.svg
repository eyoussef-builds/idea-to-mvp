<svg xmlns="http://www.w3.org/2000/svg" width="700" height="125" viewBox="0 0 1400 250" role="img"><title>How the skill works</title><g font-family="Arial, Noto Sans Arabic, sans-serif"><rect width="1400" height="250" rx="24" fill="#fafaff"/><rect x="24" y="24" width="304" height="202" rx="20" fill="#ede6ff"/><circle cx="176" cy="73" r="25" fill="white"/><text x="176" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="176" y="138" fill="#202d4a" font-size="24" font-weight="700" text-anchor="middle">Share the idea</text><text x="176" y="179" fill="#53617a" font-size="15" font-weight="400" text-anchor="middle">Messy notes are welcome</text><path d="M341 113l14 12 -14 12" fill="none" stroke="#9c8dca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="368" y="24" width="304" height="202" rx="20" fill="#e4edff"/><circle cx="520" cy="73" r="25" fill="white"/><text x="520" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="520" y="138" fill="#202d4a" font-size="24" font-weight="700" text-anchor="middle">Answer the questions</text><text x="520" y="179" fill="#53617a" font-size="15" font-weight="400" text-anchor="middle">Get a recommendation each time</text><path d="M685 113l14 12 -14 12" fill="none" stroke="#9c8dca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="24" width="304" height="202" rx="20" fill="#e0f3f3"/><circle cx="864" cy="73" r="25" fill="white"/><text x="864" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">3</text><text x="864" y="138" fill="#202d4a" font-size="24" font-weight="700" text-anchor="middle">Review the plan</text><text x="864" y="179" fill="#53617a" font-size="15" font-weight="400" text-anchor="middle">See what will be built</text><path d="M1029 113l14 12 -14 12" fill="none" stroke="#9c8dca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1056" y="24" width="304" height="202" rx="20" fill="#e3f4e9"/><circle cx="1208" cy="73" r="25" fill="white"/><text x="1208" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">4</text><text x="1208" y="138" fill="#202d4a" font-size="24" font-weight="700" text-anchor="middle">Approve and build</text><text x="1208" y="179" fill="#53617a" font-size="15" font-weight="400" text-anchor="middle">Implement, test, then deliver</text></g></svg>